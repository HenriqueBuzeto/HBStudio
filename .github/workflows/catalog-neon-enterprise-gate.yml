name: Catalog Neon Enterprise Integration
on:
  push:
    branches: [fix/catalog-serverless-real-neon-20261118]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Assert catalog does not depend on API_INTERNAL_URL
        run: |
          if grep -Rl 'forwardToBackend' app/api/catalog; then
            echo "Catalog still relies on remote .NET API" >&2
            exit 1
          fi
