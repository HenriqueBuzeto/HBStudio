name: ERP integration gate (no deployment)
on:
  push:
    branches: [integration/erp-end-to-end-20261123]
  pull_request:
    paths: ['apps/web/**', 'db/migrations/**', '.github/workflows/erp-integration-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Factory slicer metadata tests
        run: node --test tests/factory-slicer.test.mjs
      - name: Factory Kanban transition tests
        run: node --experimental-strip-types --test tests/factory-kanban.test.mjs
      - name: Inventory unit presentation tests
        run: node --experimental-strip-types --test tests/inventory-units.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
