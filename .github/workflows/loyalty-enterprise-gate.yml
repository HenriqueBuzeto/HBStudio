name: Loyalty Enterprise Gate
on:
  push:
    branches: [feat/loyalty-enterprise-neon-20261118]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build tests/BuildingBlocks.UnitTests/BuildingBlocks.UnitTests.csproj --configuration Release
      - run: dotnet test tests/BuildingBlocks.UnitTests/BuildingBlocks.UnitTests.csproj --no-build --configuration Release
