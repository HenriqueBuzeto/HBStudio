name: Fleet Enterprise build verification
on:
  push:
    branches:
      - feat/fleet-vehicles-trips-neon-20261118
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
