name: ERP serverless integrity (no deployment)
on:
  push:
    branches:
      - audit/erp-enterprise-hardening-20261118
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/erp-serverless-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict compile gate
        run: npx tsc --noEmit
      - name: Next.js build gate
        run: npm run build
