name: Repairs Enterprise static gates (no deploy)
on:
  push:
    branches: [feat/repairs-enterprise-atomic-os-20261123]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'db/migrations/20261123_repairs_enterprise_atomic.sql'
      - '.github/workflows/repairs-enterprise-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
